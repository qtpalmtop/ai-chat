<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- 禁止电话号码、邮箱自动识别为链接（iOS 默认行为） -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <!-- 主题色（iOS Safari 状态栏 / Android Chrome 顶部） -->
    <meta name="theme-color" content="#4d6bfe" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234D6BFE'/%3E%3Cstop offset='1' stop-color='%237B5CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-family='PingFang SC, Inter' font-size='18' font-weight='700'%E8%B1%86%3C/text%3E%3C/svg%3E" />
    <title>豆包 AI 助手</title>
    <!-- SSR 关键：直接在 <head> 引入 index.css，确保首屏 HTML 解析时就能拿到样式 -->
    <!-- 不依赖 main.tsx 里的 import './index.css'，那是 hydrate 之后才生效的 -->
    <link rel="stylesheet" href="/src/index.css" />
    <!-- 移动端适配（WebView 内嵌时关键） -->
    <link rel="stylesheet" href="/src/styles/mobile.css" />
    <!--antd v5 的 css-in-js 动态样式由客户端 hydrate 后注入，首屏可能短暂缺 antd 组件样式，但 layout/reset/index.css 全部到位 -->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
