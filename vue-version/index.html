<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234D6BFE'/%3E%3Cstop offset='1' stop-color='%237B5CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-family='PingFang SC, Inter' font-size='18' font-weight='700'%3E豆%3C/text%3E%3C/svg%3E" />
    <!--
      interactive-widget=resizes-content: iOS Safari 16+ 新属性
      作用：弹键盘时让 iOS 调整 visualViewport.height = window.innerHeight - keyboardHeight
      但 visualViewport 不收缩。这样 layout 可以用 100dvh 撑满实际可见区域，
      而不需要依赖 window.innerHeight（否则会被键盘遮住部分算成"可见"）。
      配合 .layout--keyboard-keep 在用户向上滚时禁用 iOS 自动滚动到 input 的行为。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>豆包 AI 助手 (Vue 版)</title>
    <!-- SSR 关键：直接在 <head> 引入 index.css，确保首屏 HTML 解析时就能拿到样式 -->
    <link rel="stylesheet" href="/src/style.css" />
    <!--antd-vue v4 的 css-in-js 动态样式由客户端 hydrate 后注入-->
  </head>
  <body>
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
